; Loaded through PHP_INI_SCAN_DIR, which bin/php sets.
; Off by default, so PHP runs at full speed. Enable per run, project, or shell with
; XDEBUG_MODE (e.g. XDEBUG_MODE=debug or XDEBUG_MODE=coverage), which overrides xdebug.mode.
zend_extension="${STATIC_PHP_PREFIX}/lib/php/extensions/xdebug.so"
xdebug.mode=off
