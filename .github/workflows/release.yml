name: Release

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: PHP branch or version (e.g. 8.5 or 8.5.10). Empty builds every missing release.
        required: false
        type: string
      publish:
        description: Publish a GitHub release. Off only builds and tests.
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: scripts/plan-releases.sh "$REQUESTED_VERSION" >>"$GITHUB_OUTPUT"

  build:
    name: PHP ${{ matrix.release.version }} (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.releases != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.releases) }}
        platform: [linux-x86_64, linux-aarch64, macos-aarch64]
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
          - platform: macos-aarch64
            runner: macos-15
    env:
      PHP_VERSION: ${{ matrix.release.version }}
      PHP_SHA256: ${{ matrix.release.sha256 }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: scripts/build.sh "$PHP_VERSION" "$PHP_SHA256" "$PLATFORM"

      - name: Smoke test
        run: scripts/smoke-test.sh "dist/php-$PHP_VERSION-$PLATFORM.tar.gz" "$PHP_VERSION"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: php-${{ matrix.release.version }}-${{ matrix.platform }}
          path: dist/php-${{ matrix.release.version }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish PHP ${{ matrix.release.version }}
    needs: [plan, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # create the GitHub release and upload its files
      id-token: write # sign the build provenance attestation
      attestations: write # store the build provenance attestation
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.releases) }}
    env:
      PHP_VERSION: ${{ matrix.release.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: php-${{ matrix.release.version }}-*
          path: dist
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/php-${{ matrix.release.version }}-*.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh "$PHP_VERSION" dist
